<!DOCTYPE html>
<html>
<body>
    <h4><a href="/">Home</a></h4>
    <h1>Simulate From Random Conditions</h1>
    {% if show_image %}
    <img src="{{ url_for('get_simulator_gif', **img_kwargs) }}" height="{{ image_height }}" width="{{ image_width }}">
    {% endif %}
    <form method="POST" action="{{ url_for('random_simulator') }}">
        <label>Growth Rate: <input type="text" name="growth_rate" value="{{ growth_rate }}"></label><br>
        <label>Predation Rate: <input type="text" name="predation_rate" value="{{ predation_rate }}"></label><br>
        <label>Predation Efficiency: <input type="text" name="predation_efficiency" value="{{ predation_efficiency }}"></label><br>
        <label>Sigma: <input type="text" name="sigma" value="{{ sigma }}"></label><br>
        <label>Iterations: <input type="text" name="iterations" value="{{ iterations }}"></label><br>
        <label>Speedup Constant: <input type="text" name="frameskip" value="{{ frameskip }}"></label><br>
        <label>Vertical Tiles: <input type="text" name="x_tiles" value="{{ x_tiles }}"></label><br>
        <label>Horizontal Tiles: <input type="text" name="y_tiles" value="{{ y_tiles }}"></label><br>
        <label>Height: <input type="text" name="image_height" value="{{ image_height }}"></label><br>
        <label>Width: <input type="text" name="image_width" value="{{ image_width }}"></label><br>
        <label>Tile Pixel Width (before scaing): <input type="text" name="tile_size" value="{{ tile_size }}"></label><br>
        <button type="submit">Submit</button>
        <!-- Hidden Elements -->
        <input type="hidden" name="start_freeze_frames" value="1">
    </form>
</body>
</html>
