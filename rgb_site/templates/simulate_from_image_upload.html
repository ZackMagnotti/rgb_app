<!DOCTYPE html>
<body>
    <h4><a href="/">Home</a></h4>
    <h1>Simulate From Image</h1>
    {% if show_image %}
    <img src="data:image/{{ img_type }};base64,{{ b64_image }}" height="{{ image_height }}" width="{{ image_width }}>
    {% endif %}
    <form method="POST" action="{{ url_for('simulate_from_image_upload') }}" enctype="multipart/form-data">
        <input type="file" name="uploaded_image" />
        <input type="submit" value="Upload" />
    </form>
</body>
